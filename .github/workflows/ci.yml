name: Test Workflow

on:
  push:
    branches: [ main, nico/f-prime-constraints-cuda-formal ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: >-
      python3 -c "import os, sys;
      os.sched_setaffinity(0, sorted(os.sched_getaffinity(0))[:8]);
      os.execvp('bash', ['bash', '--noprofile', '--norc', '-e', '-o', 'pipefail', sys.argv[1]])" "{0}"

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Check formatting
      run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Check lints
      run: cargo clippy --workspace --all-targets

  test:
    name: Nightstream and shared regression tests
    runs-on: self-hosted
    
    steps:
    - name: Install Git LFS if missing
      run: |
        if ! command -v git-lfs >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y git-lfs
        fi

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Check Lean artifact digests and links
      run: timeout --signal=KILL 300 python3 -B formal/nightstream-fprime/scripts/check_artifacts.py

    - name: Check that each premise of the claims has one class
      run: timeout --signal=KILL 300 python3 -B formal/nightstream-fprime/scripts/check_premises.py

    - name: Check SPEC.md paths, pin form, parameters table and computed values
      run: timeout --signal=KILL 300 python3 -B scripts/check_spec.py

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Get the Rust toolchain hash
      id: rust
      run: echo "toolchain=$(rustc -vV | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Show the runner's CPUs and memory
      run: |
        printf 'CPUs: %s on the machine, %s for this job\n' "$(nproc --all)" "$(nproc)"
        free -g
        cat /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max 2> /dev/null || true

    # The runner keeps its container between jobs, so this folder stays warm.
    # It is outside the checkout because actions/checkout removes ignored files.
    - name: Use this runner's target folder
      run: |
        dir="$RUNNER_WORKSPACE/target-${{ steps.rust.outputs.toolchain }}"
        find "$RUNNER_WORKSPACE" -mindepth 1 -maxdepth 1 -name 'target-*' ! -path "$dir" -exec rm -rf {} +
        echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

    - name: Build selected Rust tests
      run: bash scripts/ci_rust_tests.sh build

    - name: Run selected Rust tests sequentially
      run: bash scripts/ci_rust_tests.sh test

    - name: Run conformance coordinator tests
      run: |
        timeout --signal=KILL 300 python3 -B -m unittest scripts.tests.test_check_spec
        timeout --signal=KILL 300 python3 -B -m unittest discover -s formal/nightstream-fprime/tests -p 'test_*.py'

  lean:
    name: Lean build, axiom audits and census
    runs-on: self-hosted
    timeout-minutes: 150

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # The runner keeps its container between jobs, so this folder stays warm.
    # It is outside the checkout because actions/checkout removes ignored files.
    - name: Use this runner's Lake folder
      run: |
        dir="$RUNNER_WORKSPACE/lake-$(cat formal/nightstream-fprime/lean-toolchain formal/nightstream-fprime/lake-manifest.json | sha256sum | cut -c1-16)"
        find "$RUNNER_WORKSPACE" -mindepth 1 -maxdepth 1 -name 'lake-*' ! -path "$dir" -exec rm -rf {} +
        mkdir -p "$dir"
        rm -rf formal/nightstream-fprime/.lake
        ln -s "$dir" formal/nightstream-fprime/.lake

    - name: Install the pinned Lean toolchain and the Mathlib cache
      uses: leanprover/lean-action@v1
      with:
        lake-package-directory: formal/nightstream-fprime
        auto-config: false
        build: false
        test: false
        lint: false
        use-github-cache: false
        use-mathlib-cache: true

    - name: Run the Lean gates
      run: bash formal/nightstream-fprime/scripts/validate.sh all
