[package]
name = "neo-ajtai"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lints]
workspace = true

[features]
default = []
# Expose testing utilities (like commit_spec) without making them part of the stable API
testing = []
# Enable verbose logging for debugging (OFF by default for security - CWE-532)
neo-logs = []
wasm-threads = ["neo-ccs/wasm-threads"]

[dependencies]
# Workspace deps
neo-math = { path = "../neo-math" }
neo-params = { path = "../neo-params" }
neo-ccs = { path = "../neo-ccs" }
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

# Plonky3 (field + small dense matrix)
p3-field = { workspace = true }
p3-goldilocks = { workspace = true }
p3-matrix = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
proptest = "1.6.0"
serde_json = { workspace = true }
p3-symmetric = { workspace = true }
rand_chacha = "0.9"

# Spec-derived tests (lean oracles + invariant obligations)
[[test]]
name = "spec_ajtai_commit"
path = "spec-tests/ajtai_commit.rs"

[[test]]
name = "spec_decomposition"
path = "spec-tests/decomposition.rs"

[[test]]
name = "spec_s_module"
path = "spec-tests/s_module.rs"

[[test]]
name = "spec_public_parameters"
path = "spec-tests/public_parameters.rs"
