name = "nightstream_lean"
version = "0.1.0"
defaultTargets = ["Nightstream", "NightstreamTests", "check"]
# Lake itself observes LEAN_NUM_THREADS; spawned Lean frontends need an
# explicit shell argument. weakLeanArgs is intentionally cache-neutral.
weakLeanArgs = ["-j1"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "Nightstream"
globs = ["Nightstream", "Nightstream.+"]
moreLeanArgs = ["-DautoImplicit=false"]

[[lean_lib]]
name = "NightstreamTests"
globs = ["tests.+"]
moreLeanArgs = ["-DautoImplicit=false"]

[[lean_exe]]
name = "check"
root = "Main"
moreLeanArgs = ["-DautoImplicit=false"]
