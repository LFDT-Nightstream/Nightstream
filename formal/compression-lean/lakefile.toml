name = "compression_lean"
version = "0.1.0"
defaultTargets = ["CompressionLean", "CompressionLeanTests"]

[[require]]
name = "nightstream_fprime"
path = "../nightstream-fprime"

# Warnings are errors, so a plain `lake build` fails as a strict check would.
[[lean_lib]]
name = "CompressionLean"
roots = ["CompressionLean"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_lib]]
name = "CompressionLeanTests"
roots = ["CompressionLeanTests.Axioms", "CompressionLeanTests.BlockDigest", "CompressionLeanTests.Inventory", "CompressionLeanTests.Ports"]
needs = ["ports", "statusPage"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

# The ports gate reads these files, so a change to them reruns it.
[[input_file]]
name = "ports"
path = "ports.json"
text = true

[[input_file]]
name = "statusPage"
path = "STATUS.md"
text = true

[[lean_exe]]
name = "emitTerminal"
root = "CompressionLean.Terminal.Emit"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "replayLayer1"
root = "CompressionLean.Replay.Main"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "lowerCheck"
root = "CompressionLean.Circuit.Check"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "terminalCheck"
root = "CompressionLean.Circuit.TerminalCheck"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "setupCheck"
root = "CompressionLean.Final.SetupCheck"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "status"
root = "CompressionLeanTests.Status"
# The page pretty-prints the claims' binders, which runs imported code.
supportInterpreter = true
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
