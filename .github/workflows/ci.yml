name: Test Workflow

on:
  push:
    branches: [ main, nico/f-prime-constraints-cuda-formal ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Check formatting
      run: cargo fmt --all --check

  test:
    name: Nightstream and shared regression tests
    runs-on: [self-hosted, Linux, X64, nico-runner]
    
    steps:
    - name: Install Git LFS if missing
      run: |
        if ! command -v git-lfs >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y git-lfs
        fi

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Check Lean artifact digests and links
      run: timeout --signal=KILL 300 python3 -B formal/nightstream-fprime/scripts/check_artifacts.py

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Nextest
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: cargo-nextest@0.9.149
        fallback: none

    - name: Get Rust cache key
      id: rust
      run: echo "cachekey=$(rustc -vV | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: nico-fprime-${{ runner.os }}-${{ runner.arch }}-no-lto-cgu16-v1-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('.cargo/config.toml', 'rust-toolchain.toml', '**/Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          nico-fprime-${{ runner.os }}-${{ runner.arch }}-no-lto-cgu16-v1-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('.cargo/config.toml', 'rust-toolchain.toml', '**/Cargo.toml') }}-

    - name: Build selected Rust tests
      run: bash scripts/ci_rust_tests.sh build

    - name: Run doctests
      run: bash scripts/ci_rust_tests.sh docs

    - name: Run selected Rust tests with four workers
      run: bash scripts/ci_rust_tests.sh test

    - name: Run conformance coordinator tests
      run: |
        timeout --signal=KILL 300 python3 -B -m unittest scripts.tests.test_ci_rust_tests scripts.tests.test_golden_conformance_ci scripts.tests.test_golden_conformance_changes scripts.lean_graph.tests.test_guard scripts.lean_graph.tests.test_replay_coverage
        timeout --signal=KILL 300 python3 -B -m unittest discover -s crates/nightstream/tests -p 'test_*.py'
        timeout --signal=KILL 300 python3 -B -m unittest discover -s formal/nightstream-fprime/tests -p 'test_*.py'
