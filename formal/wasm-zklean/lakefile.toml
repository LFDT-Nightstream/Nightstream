# Lake package for verifying the wasm zkVM's R1CS arithmetization against
# zkLean (https://github.com/GaloisInc/zkLean).
#
# Pinned to Lean v4.25.2 to match zkLean (see lean-toolchain). This package
# is intentionally a leaf: nothing else in `formal/` requires it, and it does
# not require any of the other `formal/*-lean` packages. The toolchain
# mismatch with the rest of the formal subtree (which runs on v4.28.0) is
# why it lives in its own sibling directory.
#
# Lean sources for this package live under `WasmCircuit/`:
#   * `Gadgets.lean` — hand-written; `Instr` IR, `instrToRows`, soundness lemmas.
#   * `Columns.lean` — generated by the Rust exporter; gitignored.
#   * `Generated.lean` — generated by the Rust exporter; gitignored.
# The exporter is at `crates/neo-fold-next/src/bin/export_wasm_zklean.rs`.
# A clean checkout needs `cargo run --bin export_wasm_zklean` once before
# `lake build` to materialise the two generated files. See ./README.md.

name = "wasm_zklean"
defaultTargets = ["WasmCircuit"]

# zkLean is a multi-package repo; the actual library lives in `zkLean/`.
# Pinned to commit 014fa397fa30 (2026-05-04) for reproducibility.
[[require]]
name = "zkLean"
git = "https://github.com/GaloisInc/zkLean.git"
rev = "014fa397fa30"
subDir = "zkLean"

[[lean_lib]]
name = "WasmCircuit"
globs = ["WasmCircuit.+"]
