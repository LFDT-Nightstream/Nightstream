[package]
name = "neo-fold-clean"
edition = { workspace = true }
version = { workspace = true }
authors = { workspace = true }
license = "Apache-2.0"

[lints]
workspace = true

[features]
default = []

# Keep dependencies tight on purpose. Every dep is something an auditor
# will trust transitively, so the bar is high.
[dependencies]
neo-math       = { path = "../neo-math" }
neo-params     = { path = "../neo-params" }
neo-ccs        = { path = "../neo-ccs" }
neo-ajtai      = { path = "../neo-ajtai" }
neo-transcript = { path = "../neo-transcript" }
neo-reductions = { path = "../neo-reductions" }
p3-field       = { workspace = true }
# Poseidon2-in-circuit gadget: derives the same round constants `neo-ccs::PERM`
# uses by replicating its `ChaCha8Rng::from_seed(SEED)` + `next_u64()` +
# rejection-sample-to-Goldilocks path. Only `rand_chacha_p3` (= rand_chacha
# 0.10, brings `rand_core 0.10`'s `RngCore`) is needed — we sidestep the rand
# 0.9-vs-0.10 trait-version mismatch by sampling u64s directly.
p3-goldilocks  = { workspace = true }
rand_chacha_p3 = { workspace = true }
spartan2       = { workspace = true }
serde          = { workspace = true }
thiserror      = { workspace = true }

[dev-dependencies]
neo-ajtai   = { path = "../neo-ajtai" }
neo-ccs     = { path = "../neo-ccs" }
neo-math    = { path = "../neo-math" }
neo-params  = { path = "../neo-params" }
p3-field    = { workspace = true }
rand_chacha = { workspace = true }

[[test]]
name = "perf_fibonacci_bits"
path = "tests/perf/fibonacci_bits.rs"
