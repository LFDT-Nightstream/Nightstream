name = "nightstream_fprime"
version = "0.1.0"
defaultTargets = ["NightstreamFPrime", "NightstreamFPrimeTests"]
allowNonModules = true
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "06686e4c70939af82203af21516f8ab8a21a8051"

[[lean_lib]]
name = "NightstreamFPrime"
roots = ["NightstreamFPrime"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_lib]]
name = "NightstreamFPrimeTests"
roots = ["tests.AxiomsSharedExports", "tests.SharedFormulas", "tests.PiCCSNativeDot", "tests.AxiomAudit", "tests.Axioms", "tests.AxiomsFoundations", "tests.AxiomsPiRlcSampler", "tests.AxiomsAjtaiSetupV1", "tests.AxiomsPiCCSClosure", "tests.AxiomsNifsClosure", "tests.AxiomsPiRLCTail", "tests.AxiomsProductionMatrixPlan", "tests.AxiomsRecursivePublicInput", "tests.AxiomsStage1Accumulator", "tests.AxiomsStage1Application", "tests.AxiomsStage1Assembler", "tests.AxiomsStage1PiDEC", "tests.AxiomsStage1PiRLCExport", "tests.AxiomsStage1PiRLCParity", "tests.AxiomsStage1Security", "tests.AxiomsLightFold", "tests.AxiomsRefreshFold", "tests.AxiomsOptionBRandomOracle", "tests.AxiomsSchedule", "tests.AxiomsBoundedDepthIvc", "tests.AxiomsChainBinding", "tests.TranscriptCoverageChecks", "tests.NativePoseidon2Halving", "tests.ParallelLines", "tests.ParallelChunks", "tests.StoredRingInverse", "tests.PerApplicationEmitterFixture", "tests.EndpointCensus", "tests.AxiomsNebula"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "emitOptionB"
root = "NightstreamFPrime.Export.OptionB.EmitMain"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "emitSharedFormulas"
root = "NightstreamFPrime.Export.EmitSharedFormulas"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
[[lean_exe]]
name = "emitPiCCSTestErrorParity"
root = "NightstreamFPrime.Export.PiCCSTestErrorParityMain"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "emitPiRlcSamplerParity"
root = "NightstreamFPrime.Export.PiRlcSamplerParityMain"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "emitAjtaiSetupV1Parity"
root = "NightstreamFPrime.Export.AjtaiSetupV1ParityMain"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
[[lean_exe]]
name = "emitFoundationParity"
root = "NightstreamFPrime.Export.FoundationParityMain"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
