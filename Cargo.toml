[workspace]
members = [
  "crates/neo-params", 
  "crates/neo-math",
  "crates/neo-math-native",
  "crates/neo-transcript",
  "crates/neo-ajtai",
  "crates/neo-ccs",
  "crates/neo-reductions",
  "crates/ns-compress",
  "crates/neo-prover-cuda",
  "crates/neo-prover-metal",
  "crates/nightstream-fprime",
  "crates/neo-application",
  "crates/neo-wasm",
  "crates/nightstream",
]
resolver = "2"

[workspace.dependencies]
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
rayon = "1.12"
num-bigint = "0.4"

p3-field = "=0.5.3"
p3-matrix = "=0.5.3"
p3-poseidon2 = "=0.5.3"
bincode = "1.3"

proptest = "1.6.0"

[profile.dev]
opt-level = 2
debug = 1
lto = "thin"
codegen-units = 8
incremental = true

[profile.test]
opt-level = 3
lto = "thin"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
strip = "symbols"

[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = "full"
strip = false

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Nico Arqueros (Shinkai Labs) <nico@shinkai.com>"]
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/LFDT-Nightstream/Nightstream"

[workspace.lints.clippy]
uninlined_format_args = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
chunks_exact_to_as_chunks = "allow"
