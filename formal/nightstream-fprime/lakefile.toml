name = "nightstream_fprime"
version = "0.1.0"
defaultTargets = ["NightstreamFPrime", "NightstreamFPrimeTests"]
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "6133f9f796707c438d0a614f97dc218ae976ab8f"

[[lean_lib]]
name = "NightstreamFPrime"
roots = ["NightstreamFPrime"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_lib]]
name = "NightstreamFPrimeTests"
roots = ["tests.AxiomsCompactPiCCSLowering", "tests.AxiomsApplicationSelection", "tests.ConstraintReductionResearch", "tests.RunningTransitionReductionResearch", "tests.RunningTransitionReducedMatrixResearch", "tests.RunningTransitionScratchResearch", "tests.PoseidonPinReductionResearch", "tests.SharedFormulas", "tests.SharedVerifier", "tests.PiCCSNativeDot", "tests.CheckedReplayEvidence", "tests.RecursiveLoopEvidence", "tests.AxiomsStoredPhysicalRowCheck", "tests.AxiomsCompactRowExecution", "tests.FreshWitnessEvidence", "tests.AxiomsCachedAssignmentProducts", "tests.AxiomsCachedAssignmentPlan", "tests.AxiomsFreshCommitmentBlock", "tests.AxiomsStoredWitnessExecution", "tests.AxiomAudit", "tests.Axioms", "tests.AxiomsFoundations", "tests.AxiomsAjtaiSetupV1", "tests.AxiomsPiCCSClosure", "tests.AxiomsNifsClosure", "tests.AxiomsPiRLCTail", "tests.PiRLCSamplerCandidateWiring", "tests.AxiomsPiRlcWideSampler", "tests.WideRetainedSupport", "tests.AxiomsProductionMatrixPlan", "tests.AxiomsRecursivePublicInput", "tests.AxiomsStage1Accumulator", "tests.AxiomsStage1Application", "tests.AxiomsStage1Assembler", "tests.AxiomsStage1PiDEC", "tests.AxiomsStage1PiRLCExport", "tests.AxiomsStage1PiRLCParity", "tests.AxiomsStage1Security", "tests.NativePoseidon2Halving", "tests.StoredRingInverse", "tests.StoredRingPowerInverseComparison", "tests.PerApplicationEmitterFixture", "tests.EvidenceMetadata", "tests.EvidenceTargets", "tests.EvidenceAcceptance", "tests.EvidenceContractChecks"]
