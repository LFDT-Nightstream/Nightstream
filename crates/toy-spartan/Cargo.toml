[package]
name = "toy-spartan"
version = "0.4.0"
authors = ["Srinath Setty <srinath@microsoft.com>"]
edition = "2024"
description = "Standalone Spartan experiments with a Goldilocks/Poseidon2 WHIR PCS"
documentation = "https://docs.rs/toy-spartan"
readme = "README.md"
license-file = "LICENSE"
keywords = ["zkSNARKs", "cryptography", "proofs"]

[dependencies]
bellpepper-core = "0.4.0"
bellpepper = "0.4.0"
ff = { version = "0.13.0", features = ["derive"] }
digest = "0.10"
sha3 = "0.10"
rayon = "1.10.0"
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
itertools = "0.14.0"
subtle = "2.5"
generic-array = "0.14"
num-bigint = { version = "0.4", features = ["serde", "rand"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
flate2 = "1.0"
bitvec = "1.0"
byteorder = "1.4.3"
thiserror = "2.0.12"
halo2curves = { version = "0.9.0", features = ["derive_serde", "std"] }
group = "0.13.0"
once_cell = "1.18.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "time"] }
neo-params = { path = "../neo-params" }

# Plonky3 / p3 field + Poseidon2 for Goldilocks
p3-field = { workspace = true }
p3-goldilocks = { workspace = true }
p3-poseidon2 = { workspace = true }
p3-symmetric = { workspace = true }

# WHIR's prescribed-point PCS API is newer than the 0.6.1 release. Pin the
# exact reviewed Plonky3 revision and keep its 0.6-generation types isolated
# from SuperNeo's existing 0.5.1 dependencies through explicit aliases.
p3-challenger-whir = { package = "p3-challenger", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3", optional = true }
p3-commit-whir = { package = "p3-commit", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3", optional = true }
p3-dft-whir = { package = "p3-dft", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3", optional = true }
p3-field-whir = { package = "p3-field", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3", optional = true }
p3-goldilocks-whir = { package = "p3-goldilocks", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3", optional = true }
p3-matrix-whir = { package = "p3-matrix", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3", optional = true }
p3-merkle-tree-whir = { package = "p3-merkle-tree", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3", optional = true }
p3-multilinear-util-whir = { package = "p3-multilinear-util", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3", optional = true }
p3-sumcheck-whir = { package = "p3-sumcheck", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3", optional = true }
p3-symmetric-whir = { package = "p3-symmetric", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3", optional = true }
p3-whir = { git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3", features = ["parallel"], optional = true }
rand = { version = "0.9", optional = true }
rand_chacha = "0.9"
rand_chacha_p3 = { package = "rand_chacha", version = "0.10.0" }

[target.wasm32-unknown-unknown.dependencies]
# see https://github.com/rust-random/rand/pull/948
getrandom = { version = "0.2.0", default-features = false, features = ["js"] }
js-sys = "0.3"

[dev-dependencies]
rand = "0.9"
hex = "0.4.3"
cfg-if = "1.0.0"
sha2 = "0.10.7"
proptest = "1.2.0"

[features]
default = ["p3_backend"]
p3_backend = [
  "p3-challenger-whir",
  "p3-commit-whir",
  "p3-dft-whir",
  "p3-field-whir",
  "p3-goldilocks-whir",
  "p3-matrix-whir",
  "p3-merkle-tree-whir",
  "p3-multilinear-util-whir",
  "p3-sumcheck-whir",
  "p3-symmetric-whir",
  "p3-whir",
  "rand",
]
wasm-threads = []

[target.'cfg(target_arch = "x86_64")'.dependencies]
halo2curves = { version = "0.9.0", features = ["derive_serde", "std", "asm"] }
