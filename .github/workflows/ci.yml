name: Test Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, nico/f-prime-constraints-cuda-formal ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Check formatting
      run: cargo fmt --all --check

  test:
    name: Nightstream and shared regression tests
    runs-on: self-hosted
    
    steps:
    - name: Provide Git LFS before checkout
      run: |
        if ! command -v git-lfs >/dev/null; then
          lfs_package_dir=$(mktemp -d "$RUNNER_TEMP/git-lfs.XXXXXX")
          cd "$lfs_package_dir"
          apt-get download git-lfs
          dpkg-deb --extract git-lfs_*.deb .
          echo "$lfs_package_dir/usr/bin" >> "$GITHUB_PATH"
        fi

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true
      
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Run Nightstream tests
      run: timeout --signal=KILL 300 cargo test -p nightstream --release

    - name: Run packed witness tests
      run: timeout --signal=KILL 300 cargo test -p neo-ccs --release --test packed_witness

    - name: Run matrix row tests
      run: timeout --signal=KILL 300 cargo test -p neo-reductions --release --test matrix_rows

    - name: Run wide sampler parity tests
      run: timeout --signal=KILL 300 cargo test -p neo-reductions --release --test pi_rlc_wide_lean_parity

    - name: Run matrix program tests
      run: timeout --signal=KILL 300 cargo test -p nightstream-fprime --release --lib matrix_program

    - name: Run retained assignment transport tests
      run: timeout --signal=KILL 300 cargo test -p nightstream-fprime --release --lib assignment_transport

    - name: Run application record and recipe stack tests
      run: timeout --signal=KILL 300 cargo test -p nightstream-fprime --release --lib application_records

    - name: Run native application tests
      run: timeout --signal=KILL 300 cargo test -p nightstream-fprime --release --lib package::native_application

    - name: Install Python for golden tools
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check golden conformance tools
      run: |
        timeout --signal=KILL 300 python3 -B -m unittest scripts.tests.test_golden_conformance_ci
        timeout --signal=KILL 300 python3 -B crates/nightstream/tests/test_run_golden_conformance.py
        timeout --signal=KILL 300 python3 -B crates/nightstream/tests/test_check_lean_fold.py
        timeout --signal=KILL 300 python3 -B crates/nightstream/tests/test_check_golden_vectors.py

    # CI runs no Lean. Lean build, axiom, boundary and identity checks run
    # locally with scripts/check_lean.sh (owner decision, 2026-09-26).
    - name: Compare Rust primitives with saved Lean results
      run: bash scripts/check_fprime_foundation_parity.sh

