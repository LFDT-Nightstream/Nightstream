[package]
name = "wip-spartan"
version = "0.4.0"
authors = ["Srinath Setty <srinath@microsoft.com>"]
edition = "2024"
description = "Nightstream's work-in-progress Spartan backend over Goldilocks, Poseidon2, and WHIR"
readme = "README.md"
license-file = "LICENSE"
keywords = ["zkSNARKs", "cryptography", "proofs"]

[dependencies]
ff = { version = "0.13.0", features = ["derive"] }
rayon = "1.10.0"
rand_core = { version = "0.6", default-features = false }
subtle = "2.5"
num-bigint = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "2.0.12"
once_cell = "1.18.0"
tracing = "0.1"
neo-params = { path = "../neo-params" }

p3-field = { workspace = true }
p3-goldilocks = { workspace = true }
p3-symmetric = { workspace = true }

# WHIR's prescribed-point PCS API is newer than the 0.6.1 release. Keep this
# reviewed revision isolated from the workspace's 0.5-generation types.
p3-challenger-whir = { package = "p3-challenger", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3" }
p3-commit-whir = { package = "p3-commit", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3" }
p3-dft-whir = { package = "p3-dft", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3" }
p3-field-whir = { package = "p3-field", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3" }
p3-goldilocks-whir = { package = "p3-goldilocks", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3" }
p3-matrix-whir = { package = "p3-matrix", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3" }
p3-merkle-tree-whir = { package = "p3-merkle-tree", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3" }
p3-multilinear-util-whir = { package = "p3-multilinear-util", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3" }
p3-sumcheck-whir = { package = "p3-sumcheck", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3" }
p3-symmetric-whir = { package = "p3-symmetric", git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3" }
p3-whir = { git = "https://github.com/Plonky3/Plonky3.git", rev = "6b6a3b4d40fca2187d368c9dc1fca417c84ae8c3", features = ["parallel"] }
rand_chacha_p3 = { package = "rand_chacha", version = "0.10.0" }
