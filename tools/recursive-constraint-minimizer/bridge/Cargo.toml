[package]
name = "nightstream-constraint-exporter"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[dependencies]
bincode = "=1.3.3"
neo-ccs = { path = "../../../crates/neo-ccs" }
neo-fold-clean = { path = "../../../crates/neo-fold-clean" }
neo-math = { path = "../../../crates/neo-math" }
p3-field = "=0.5.3"
recursive-constraint-minimizer = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
neo-ajtai = { path = "../../../crates/neo-ajtai" }
neo-params = { path = "../../../crates/neo-params" }
