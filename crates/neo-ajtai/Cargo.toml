[package]
name = "neo-ajtai"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lints]
workspace = true

[features]
default = []
testing = []
wasm-threads = ["neo-ccs/wasm-threads"]

[dependencies]
neo-math = { path = "../neo-math" }
neo-ccs = { path = "../neo-ccs" }
rand = { workspace = true }
serde = { workspace = true }
# `asm` uses the ARMv8 SHA3 instructions on aarch64 after a run-time check and has no effect on other targets.
sha3 = { version = "0.10.8", features = ["asm"] }
keccak = { version = "0.2.2", features = ["parallel"] }
thiserror = { workspace = true }
rayon = { workspace = true }

p3-field = { workspace = true }
p3-goldilocks = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
p3-symmetric = { workspace = true }
rand_chacha = { workspace = true }
