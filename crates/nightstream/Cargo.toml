[package]
name = "nightstream"
edition = { workspace = true }
version = { workspace = true }
authors = { workspace = true }
license = "Apache-2.0"
include = ["/src/**", "/tests/**", "/artifacts/**", "/README.md", "/VALIDATION.md"]

[lints]
workspace = true

[[bin]]
name = "nightstream-poseidon2-bench"
path = "src/bin/poseidon2_bench.rs"
test = false
bench = false

[features]
default = []
metal = ["dep:neo-prover-metal", "neo-prover-metal/metal"]
# The canonical kernel is absent. Compile its availability boundary without
# pulling an unused CUDA driver/toolchain into this library.
cuda = ["dep:neo-prover-cuda"]

[dependencies]
neo-prover-metal = { path = "../neo-prover-metal", default-features = false, optional = true }
neo-prover-cuda = { path = "../neo-prover-cuda", default-features = false, optional = true }
nightstream-fprime = { path = "../nightstream-fprime" }
neo-math = { path = "../neo-math" }
neo-params = { path = "../neo-params" }
neo-ccs = { path = "../neo-ccs" }
neo-ajtai = { path = "../neo-ajtai" }
neo-transcript = { path = "../neo-transcript" }
neo-reductions = { path = "../neo-reductions" }
p3-field = { workspace = true }
p3-goldilocks = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
neo-fold-clean = { path = "../neo-fold-clean" }
