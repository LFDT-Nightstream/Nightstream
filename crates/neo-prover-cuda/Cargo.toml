[package]
name = "neo-prover-cuda"
edition = { workspace = true }
version = { workspace = true }
authors = { workspace = true }
license = "Apache-2.0"

[lib]
name = "neo_prover_cuda"

[lints]
workspace = true

[features]
default = []
# CUDA backend. Build and run through `cargo +nightly-2026-04-03 oxide` only;
# plain cargo builds must keep this feature off so the workspace stays green
# without a GPU or the cuda-oxide codegen backend.
cuda = [
    "dep:cuda-core",
]
# Per-phase stderr timings, following the workspace perf-timers convention.
perf-timers = ["neo-fold-clean/perf-timers"]

[dependencies]
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "baa1773ad834e6869f5341ff6dd0ba1b48c3e1b8", optional = true }
neo-fold-clean = { path = "../neo-fold-clean" }

[dev-dependencies]
neo-ccs = { path = "../neo-ccs" }
neo-math = { path = "../neo-math" }
p3-field = { workspace = true }
