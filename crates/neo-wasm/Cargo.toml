[package]
name = "neo-wasm"
edition = { workspace = true }
version = { workspace = true }
authors = { workspace = true }
license = "Apache-2.0"

# The workspace allows, plus the lints that main's neo-wasm code trips. Main's CI runs no clippy.
[lints.clippy]
uninlined_format_args = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
absurd_extreme_comparisons = "allow"
doc_lazy_continuation = "allow"
err_expect = "allow"
manual_async_fn = "allow"
manual_range_contains = "allow"
needless_borrow = "allow"
non_canonical_clone_impl = "allow"
redundant_closure = "allow"
unnecessary_cast = "allow"
useless_conversion = "allow"

[features]
default = []
audit-html = ["neo-application/audit-html"]

[[bin]]
name = "wasm_column_audit"
path = "src/bin/wasm_column_audit.rs"
required-features = ["audit-html"]

[[test]]
name = "wasm_column_audit"
path = "tests/wasm_column_audit.rs"
required-features = ["audit-html"]

[dependencies]
neo-application = { path = "../neo-application" }
neo-ccs = { path = "../neo-ccs" }
neo-math = { path = "../neo-math" }
futures = "0.3"
p3-field = { workspace = true }
p3-goldilocks = { workspace = true }
thiserror = { workspace = true }
wasmparser = "0.240"
wasmtime = { version = "50", default-features = false, features = [
    "anyhow",
    "async",
    "component-model",
    "cranelift",
    "debug",
    "gc",
    "gc-null",
    "runtime",
] }

[dev-dependencies]
serde_json = { workspace = true }
wat = "1"
