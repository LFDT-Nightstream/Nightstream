[package]
name = "neo-reductions"
edition = { workspace = true }
version = { workspace = true }
authors = { workspace = true }
license = "Apache-2.0"

[lints]
workspace = true

[features]
default = ["paper-exact"]
testing = []
paper-exact = []
debug-logs = ["neo-transcript/debug-log"]
perf-timers = []
fs-guard = ["neo-transcript/fs-guard"]
wasm-threads = ["neo-ajtai/wasm-threads", "neo-ccs/wasm-threads"]

[dependencies]
neo-math = { path = "../neo-math" }
neo-ajtai = { path = "../neo-ajtai" }
neo-ccs = { path = "../neo-ccs" }
neo-params = { path = "../neo-params" }
neo-transcript = { path = "../neo-transcript" }
p3-field = { workspace = true }
p3-matrix = { workspace = true }
p3-challenger = { workspace = true }
p3-poseidon2 = { workspace = true }
p3-goldilocks = { workspace = true }
p3-symmetric = { workspace = true }
rand = { workspace = true }
rand_chacha_p3 = { workspace = true }
thiserror = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
proptest = { workspace = true }
p3-goldilocks = { workspace = true }
p3-field = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
