name = "ajtai_lean"
version = "0.1.0"
defaultTargets = ["Ajtai", "AjtaiTests", "check"]
weakLeanArgs = ["-j1"]

[[require]]
name = "nightstream_lean"
path = "../nightstream-lean"

[[require]]
name = "superneo_lean"
path = "../superneo-lean"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

[[lean_lib]]
name = "Ajtai"
globs = ["Ajtai", "Ajtai.+"]
moreLeanArgs = ["-DautoImplicit=false"]

[[lean_lib]]
name = "AjtaiTests"
globs = ["tests.+"]
moreLeanArgs = ["-DautoImplicit=false"]

[[lean_exe]]
name = "check"
root = "Main"
moreLeanArgs = ["-DautoImplicit=false"]
