[workspace]
members = [
  "crates/neo-params", 
  "crates/neo-math", 
  # Implementation crates
  "crates/neo-transcript",
  "crates/neo-ajtai",
  "crates/neo-ccs",
  "crates/neo-reductions",
  "crates/neo-prover-cuda",
  "crates/neo-prover-metal",
  "crates/nightstream-fprime",
  "crates/neo-verified",
  "crates/neo-spartan",
  "crates/neo-application",
  "crates/neo-wasm",
  "crates/nightstream",
]
exclude = [
  "external/Spartan2",
]
resolver = "2"

[workspace.dependencies]
# Core
rand = "0.9"
rand_chacha = "0.9"
rand_chacha_p3 = { package = "rand_chacha", version = "0.10.0" }
rand_p3 = { package = "rand", version = "0.10" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
rayon = "1.12"
once_cell = "1.19"
num-bigint = "0.4"

# Plonky3 core (Poseidon2 transcript only)
p3-field = "=0.5.3"
p3-goldilocks = { version = "=0.5.3", default-features = false }
p3-matrix = "=0.5.3"
p3-symmetric = "=0.5.3"    # Poseidon2 for FS transcript
p3-poseidon2 = "=0.5.3"
p3-challenger = "=0.5.3"
bincode = "1.3"

# Tests
proptest = "1.6.0"

[profile.dev]
opt-level = 2
debug = 1
lto = "thin"
codegen-units = 8
incremental = true

[profile.test]
opt-level = 3
lto = "thin"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
strip = "symbols"

# Profiling-friendly profile: balances performance with good debug symbols
[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = 2  # Full debug info including line numbers
strip = false  # Keep symbols for profiler

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Nico Arqueros (Shinkai Labs) <nico@shinkai.com>"]
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/LFDT-Nightstream/Nightstream"

[workspace.lints.clippy]
# Allow older-style format strings (prefer explicit for complex error messages)
uninlined_format_args = "allow"
# Allow functions with many arguments (cryptographic functions often need many params)
too_many_arguments = "allow"
# Allow range loops with indices (simple for i in 0..D is more performant for fixed-size arrays)
needless_range_loop = "allow"
# Allow complex types in cryptographic code (proof systems have inherently complex types)
type_complexity = "allow"
