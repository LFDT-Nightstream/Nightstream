[package]
name = "neo-wasm"
edition = { workspace = true }
version = { workspace = true }
authors = { workspace = true }
license = "Apache-2.0"

[lints]
workspace = true

[features]
default = ["metal"]
metal = ["dep:neo-prover-metal", "neo-prover-metal/metal"]
cuda = ["dep:neo-prover-cuda", "neo-prover-cuda/cuda"]
perf-timers = ["neo-fold-clean/perf-timers"]

[dependencies]
neo-ajtai = { path = "../neo-ajtai" }
neo-ccs = { path = "../neo-ccs" }
neo-fold-clean = { path = "../neo-fold-clean" }
neo-math = { path = "../neo-math" }
neo-params = { path = "../neo-params" }
neo-prover-cuda = { path = "../neo-prover-cuda", optional = true }
neo-reductions = { path = "../neo-reductions" }
neo-transcript = { path = "../neo-transcript" }
ff = { workspace = true, features = ["derive"] }
futures = "0.3"
once_cell = { workspace = true }
p3-field = { workspace = true }
p3-goldilocks = { workspace = true }
p3-poseidon2 = { workspace = true }
p3-symmetric = { workspace = true }
rayon = { workspace = true }
rand_chacha_p3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
wasmparser = "0.240"
wasmtime = { version = "47.0.0", features = ["debug", "cranelift"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
neo-prover-metal = { path = "../neo-prover-metal", optional = true }

[dev-dependencies]
object = "0.37"
rand_chacha = { workspace = true }
wat = "1"
