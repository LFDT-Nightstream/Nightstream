[package]
name = "neo-compress"
edition = { workspace = true }
version = { workspace = true }
authors = { workspace = true }
license = "Apache-2.0"
include = ["/src/**", "/tests/**", "/artifacts/**"]

[lints]
workspace = true

[dependencies]
neo-math = { path = "../neo-math" }
neo-ajtai = { path = "../neo-ajtai" }
neo-ccs = { path = "../neo-ccs" }
neo-reductions = { path = "../neo-reductions" }
neo-transcript = { path = "../neo-transcript" }
p3-field = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
# Akita, ePrint 2026/1983. `akita-pcs` holds the prover, and only
# `src/akita/prover.rs` reads it. The Jolt revision is Akita's own pin.
# `scripts/akita_schedules.sh` makes the schedule files of `artifacts/`.
akita-pcs = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "d50f700fb1a292395a717cef0e6f437c7ce2cdb1" }
akita-config = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "d50f700fb1a292395a717cef0e6f437c7ce2cdb1" }
akita-params = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "d50f700fb1a292395a717cef0e6f437c7ce2cdb1" }
akita-serialization = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "d50f700fb1a292395a717cef0e6f437c7ce2cdb1" }
akita-types = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "d50f700fb1a292395a717cef0e6f437c7ce2cdb1" }
akita-verifier = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "d50f700fb1a292395a717cef0e6f437c7ce2cdb1" }
jolt-field = { git = "https://github.com/a16z/jolt", rev = "25d87ba68bde9f4a85ac986f5487b2e7b7db2699", default-features = false, features = ["asm", "solinas"] }

[dev-dependencies]
# The rows of the step circuits, for the test of the matrix part.
nightstream-fprime = { path = "../nightstream-fprime" }
rand = { workspace = true }
rand_chacha = { workspace = true }
# The digests of the schedule files of `artifacts/`.
sha2 = "0.10.9"
