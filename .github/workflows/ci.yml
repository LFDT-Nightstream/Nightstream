name: Test Workflow

on:
  push:
    branches: [ main, nico/f-prime-constraints-cuda-formal ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: >-
      python3 -c "import os, sys;
      os.sched_setaffinity(0, sorted(os.sched_getaffinity(0))[:8]);
      os.execvp('bash', ['bash', '--noprofile', '--norc', '-e', '-o', 'pipefail', sys.argv[1]])" "{0}"

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Check formatting
      run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Check lints
      run: cargo clippy --workspace --all-targets

  formal-bridge:
    name: Rocq and Lean checks of the WASM binding
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check the pins of the Rocq copy and of the binding exports
      run: |
        timeout --signal=KILL 300 python3 -B formal/nightstream-fprime/scripts/check_rocq_copy.py
        timeout --signal=KILL 300 python3 -B formal/nightstream-fprime/scripts/check_binding_pins.py

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Lean and get the Mathlib cache
      uses: leanprover/lean-action@v1
      with:
        lake-package-directory: formal/nightstream-fprime
        auto-config: false
        use-mathlib-cache: true

    - name: Build the Lean checker of the binding exports
      run: bash formal/nightstream-fprime/scripts/validate.sh build checkWasmBinding

    - name: Check the binding export of each WASM size
      run: bash scripts/check_wasm_binding.sh

    - name: Install OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: "5.3.0"
        opam-repositories: |
          default: https://opam.ocaml.org
          rocq-released: https://rocq-prover.org/opam/released

    - name: Install Rocq
      run: opam install -y coq.9.0.1 coq-mathcomp-ssreflect.2.4.0 coq-record-update.0.3.6

    - name: Build the Rocq proofs and tests and check their assumptions
      run: opam exec -- make -C formal/wasm-rocq -j"$(nproc)" audit

  test:
    name: Nightstream and shared regression tests
    runs-on: self-hosted
    
    steps:
    - name: Install Git LFS if missing
      run: |
        if ! command -v git-lfs >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y git-lfs
        fi

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Check Lean artifact digests and links
      run: timeout --signal=KILL 300 python3 -B formal/nightstream-fprime/scripts/check_artifacts.py

    - name: Check that each premise of the claims has one class
      run: timeout --signal=KILL 300 python3 -B formal/nightstream-fprime/scripts/check_premises.py

    - name: Check SPEC.md paths, pin form and parameters table
      run: timeout --signal=KILL 300 python3 -B scripts/check_spec.py

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Get the Rust toolchain hash
      id: rust
      run: echo "toolchain=$(rustc -vV | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Show the runner's CPUs and memory
      run: |
        printf 'CPUs: %s on the machine, %s for this job\n' "$(nproc --all)" "$(nproc)"
        free -g
        cat /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max 2> /dev/null || true

    # The runner keeps its container between jobs, so this folder stays warm.
    # It is outside the checkout because actions/checkout removes ignored files.
    - name: Use this runner's target folder
      run: |
        dir="$RUNNER_WORKSPACE/target-${{ steps.rust.outputs.toolchain }}"
        find "$RUNNER_WORKSPACE" -mindepth 1 -maxdepth 1 -name 'target-*' ! -path "$dir" -exec rm -rf {} +
        echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

    - name: Build selected Rust tests
      run: bash scripts/ci_rust_tests.sh build

    - name: Run selected Rust tests sequentially
      run: bash scripts/ci_rust_tests.sh test

    - name: Run conformance coordinator tests
      run: |
        timeout --signal=KILL 300 python3 -B -m unittest scripts.tests.test_check_spec
        timeout --signal=KILL 300 python3 -B -m unittest discover -s formal/nightstream-fprime/tests -p 'test_*.py'
