name = "nightstream_fprime"
version = "0.1.0"
defaultTargets = ["NightstreamFPrime", "NightstreamFPrimeTests"]
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "NightstreamFPrime"
roots = ["NightstreamFPrime"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_lib]]
name = "NightstreamFPrimeTests"
roots = ["tests.AxiomAudit", "tests.Axioms", "tests.AxiomsAjtaiSetupV1", "tests.AxiomsPiRLCTail", "tests.AxiomsProductionMatrixPlan", "tests.AxiomsRecursivePublicInput", "tests.AxiomsStage1Accumulator", "tests.AxiomsStage1Application", "tests.AxiomsStage1Assembler", "tests.AxiomsStage1PiDEC", "tests.AxiomsStage1PiRLCExport", "tests.AxiomsStage1PiRLCParity", "tests.AxiomsStage1Security", "tests.PerApplicationEmitterFixture"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "emit"
root = "NightstreamFPrime.Export.Entrypoint"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "emitPerApplicationReferenceFixture"
root = "tests.PerApplicationReferenceMain"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "emitPerApplicationStreamedFixture"
root = "tests.PerApplicationStreamedMain"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "emitPilotParity"
root = "NightstreamFPrime.Export.PilotParityMain"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "emitPiCCSParity"
root = "NightstreamFPrime.Export.PiCCSParityMain"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "emitPiRlcSamplerParity"
root = "NightstreamFPrime.Export.PiRlcSamplerParityMain"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "emitPiRLCParity"
root = "NightstreamFPrime.Export.PiRLCParityMain"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "emitPiDECParity"
root = "NightstreamFPrime.Export.PiDECParityMain"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "emitAjtaiSetupV1Parity"
root = "NightstreamFPrime.Export.AjtaiSetupV1ParityMain"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "emitPoseidon2HashChainV1Parity"
root = "NightstreamFPrime.Export.Poseidon2HashChainV1ParityMain"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
