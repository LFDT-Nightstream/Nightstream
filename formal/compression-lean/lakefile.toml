name = "compression_lean"
version = "0.1.0"
defaultTargets = ["CompressionLean", "CompressionLeanTests", "CompressionLeanExe", "emitTerminal", "replayLayer1",
  "lowerCheck", "terminalCheck", "setupCheck", "setupRootCheck", "runsCheck", "status", "NeoVerified",
  "CompressionLeanRust", "CompressionLeanRustTests"]
allowNonModules = true

[[require]]
name = "nightstream_fprime"
path = "../nightstream-fprime"

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
rev = "de16f3cf877976e966906dc890f63dcb418884fa"
subDir = "backends/lean"

# Warnings are errors, so a plain `lake build` fails as a strict check would.
[[lean_lib]]
name = "CompressionLean"
roots = ["CompressionLean"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_lib]]
name = "CompressionLeanTests"
roots = ["CompressionLeanTests.Axioms", "CompressionLeanTests.BlockDigest", "CompressionLeanTests.Inventory", "CompressionLeanTests.Layers",
  "CompressionLeanTests.Ports", "CompressionLeanTests.Reading", "CompressionLeanTests.SpecCensus",
  "CompressionLeanTests.Stack", "CompressionLeanTests.Vocabulary"]
# The axiom audit reads the build of each executable, so the executables build first.
needs = ["ports", "statusPage", "CompressionLeanExe"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

# Aeneas's translation of `crates/neo-verified`. `scripts/aeneas_extract.sh` writes it, and
# CI fails when a file differs from the script's output.
[[lean_lib]]
name = "NeoVerified"
roots = ["NeoVerified.Types", "NeoVerified.Funs1", "NeoVerified.Funs2", "NeoVerified.Funs3", "NeoVerified.Funs4",
  "NeoVerified.Funs5", "NeoVerified.Funs6", "NeoVerified.Funs"]

[[lean_lib]]
name = "CompressionLeanRust"
roots = ["CompressionLeanRust"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_lib]]
name = "CompressionLeanRustTests"
roots = ["CompressionLeanRustTests"]
needs = ["ports"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

# The executables, their readers and the Lean side of the Rust test programs.
# Each module with a `main` is the root of one `lean_exe` below. Only `status`
# builds its root module (see there).
[[lean_lib]]
name = "CompressionLeanExe"
roots = ["CompressionLeanExe.Digest", "CompressionLeanExe.EmitTerminal",
  "CompressionLeanExe.Fixtures", "CompressionLeanExe.Key", "CompressionLeanExe.LowerCheck",
  "CompressionLeanExe.Parse", "CompressionLeanExe.ReplayLayer1", "CompressionLeanExe.Runs",
  "CompressionLeanExe.RunsCheck", "CompressionLeanExe.SetupCheck",
  "CompressionLeanExe.SetupRootCheck", "CompressionLeanExe.TerminalCheck"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

# The ports gate reads these files, so a change to them reruns it.
[[input_file]]
name = "ports"
path = "ports.json"
text = true

[[input_file]]
name = "statusPage"
path = "STATUS.md"
text = true

[[lean_exe]]
name = "emitTerminal"
root = "CompressionLeanExe.EmitTerminal"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_exe]]
name = "replayLayer1"
root = "CompressionLeanExe.ReplayLayer1"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_exe]]
name = "lowerCheck"
root = "CompressionLeanExe.LowerCheck"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_exe]]
name = "terminalCheck"
root = "CompressionLeanExe.TerminalCheck"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_exe]]
name = "setupCheck"
root = "CompressionLeanExe.SetupCheck"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_exe]]
name = "setupRootCheck"
root = "CompressionLeanExe.SetupRootCheck"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_exe]]
name = "runsCheck"
root = "CompressionLeanExe.RunsCheck"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_exe]]
name = "status"
root = "CompressionLeanExe.Status"
# The page reads ports.json when the root module compiles, so the module needs
# it. A module's trace includes the `needs` of the target that builds it, so a
# second owner without `needs` would rebuild it in turn.
needs = ["ports"]
# The page pretty-prints the claims' binders, which runs imported code.
supportInterpreter = true
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }
