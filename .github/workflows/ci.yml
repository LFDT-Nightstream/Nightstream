name: Test Workflow

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Check formatting
      run: cargo fmt --all --check

  test:
    name: Nightstream and shared regression tests
    runs-on: self-hosted
    
    steps:
    - name: Install Git LFS if missing
      run: |
        if ! command -v git-lfs >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y git-lfs
        fi

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
      
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Run Nightstream tests
      run: timeout --signal=KILL 300 cargo test -p nightstream --release

    - name: Run compression layer-1 tests
      run: timeout --signal=KILL 300 cargo test -p neo-spartan --release

    - name: Run packed witness tests
      run: timeout --signal=KILL 300 cargo test -p neo-ccs --release --test packed_witness

    - name: Run fixed-key arithmetic tests
      run: |
        timeout --signal=KILL 300 cargo test -p neo-math --release --test signed_sums
        timeout --signal=KILL 300 cargo test -p neo-ajtai --release --lib key::tests
        timeout --signal=KILL 300 cargo test -p neo-ajtai --release --test nightstream_fprime_setup_parity --test nightstream_fprime_signed_commitment --test nightstream_fprime_prefix_commitment --test nightstream_fprime_matrix_commitment --test nightstream_fprime_batch_commitment

    - name: Run matrix row tests
      run: |
        timeout --signal=KILL 300 cargo test -p neo-reductions --release --test matrix_rows
        timeout --signal=KILL 300 cargo test -p neo-reductions --release --lib superneo_eval::openings::tests::

    - name: Run application record and recipe stack tests
      run: timeout --signal=KILL 300 cargo test -p nightstream-fprime --release --lib application_records

    - name: Run native application tests
      run: timeout --signal=KILL 300 cargo test -p nightstream-fprime --release --lib package::native_application

    - name: Run sampler parity
      run: timeout --signal=KILL 300 cargo test -p neo-reductions --release --test pi_rlc_lean_parity

    - name: Run matrix interpreter tests
      run: timeout --signal=KILL 300 cargo test -p nightstream-fprime --release --lib package::matrix_program

    - name: Run Phi81 quotient witness tests
      run: timeout --signal=KILL 300 cargo test -p nightstream-fprime --release --lib package::assignment_transport::quotient_tests

    - name: Run assignment transport boundary tests
      run: timeout --signal=KILL 300 cargo test -p nightstream-fprime --release --lib package::sealed::sealed_tests

    - name: Run conformance coordinator tests
      run: |
        timeout --signal=KILL 300 python3 -B -m unittest scripts.tests.test_golden_conformance_ci scripts.tests.test_golden_conformance_changes scripts.lean_graph.tests.test_guard scripts.lean_graph.tests.test_replay_coverage
        timeout --signal=KILL 300 python3 -B -m unittest discover -s crates/nightstream/tests -p 'test_*.py'
        timeout --signal=KILL 300 python3 -B -m unittest discover -s formal/nightstream-fprime/tests -p 'test_*.py'
