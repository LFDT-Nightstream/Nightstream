[package]
name = "neo-prover-cuda"
edition = { workspace = true }
version = { workspace = true }
authors = { workspace = true }
license = "Apache-2.0"

[lib]
name = "neo_prover_cuda"

[lints]
workspace = true

[features]
default = []
# CUDA backend. Build and test it only with the cuda-oxide codegen backend
# (README.md); a plain cargo build keeps this feature off.
cuda = [
    "dep:cuda-core",
    "dep:cuda-device",
    "dep:cuda-host",
    "dep:rayon",
]
perf-timers = []

[dependencies]
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "baa1773ad834e6869f5341ff6dd0ba1b48c3e1b8", optional = true }
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "baa1773ad834e6869f5341ff6dd0ba1b48c3e1b8", optional = true }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "baa1773ad834e6869f5341ff6dd0ba1b48c3e1b8", optional = true }
neo-ajtai = { path = "../neo-ajtai" }
neo-ccs = { path = "../neo-ccs" }
neo-math = { path = "../neo-math" }
neo-reductions = { path = "../neo-reductions" }
p3-field = { workspace = true }
rayon = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
neo-math = { path = "../neo-math" }
neo-params = { path = "../neo-params" }
neo-transcript = { path = "../neo-transcript" }
p3-field = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
