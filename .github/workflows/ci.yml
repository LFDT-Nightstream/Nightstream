name: Test Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Check formatting
      run: cargo fmt --all --check

  test:
    name: Nightstream and shared regression tests
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true
      
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Run Nightstream tests
      run: timeout --signal=KILL 300 cargo test -p nightstream --release

    - name: Run packed witness tests
      run: timeout --signal=KILL 300 cargo test -p neo-ccs --release --test packed_witness

    - name: Run matrix row tests
      run: timeout --signal=KILL 300 cargo test -p neo-reductions --release --test matrix_rows

    - name: Run application record and recipe stack tests
      run: timeout --signal=KILL 300 cargo test -p nightstream-fprime --release --lib application_records

    - name: Run native application tests
      run: timeout --signal=KILL 300 cargo test -p nightstream-fprime --release --lib package::native_application

  lean-assurance:
    name: Lean assurance
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pinned Lean toolchain
      uses: leanprover/lean-action@v1
      with:
        lake-package-directory: formal/nightstream-fprime
        auto-config: false
        build: false
        test: false
        lint: false
        use-github-cache: true
        use-mathlib-cache: true

    - name: Run bounded assurance gates
      working-directory: formal/nightstream-fprime
      run: ./scripts/validate.sh all

